server:
  port: 8888

spring:
  application:
    name: config-service
  cloud:
    config:
      server:
        git:
          uri: https://github.com/anvvhe190784/Ride_Hailing_Config_Repo.git
          default-label: main
          clone-on-start: true
          timeout: 10
  threads:
    virtual:
      enabled: true

eureka:
  client:
    service-url:
      # noinspection HttpUrlsUsage
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
