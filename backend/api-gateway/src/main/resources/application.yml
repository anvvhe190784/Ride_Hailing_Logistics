server:
  port: 8080

spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: iam-service-route
          uri: lb://iam-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**

        - id: driver-service-route
          uri: lb://driver-service
          predicates:
            - Path=/api/v1/drivers/**,/api/v1/vehicles/**

        - id: location-service-route
          uri: lb://location-service
          predicates:
            - Path=/api/v1/locations/**

        - id: pricing-service-route
          uri: lb://pricing-service
          predicates:
            - Path=/api/v1/pricing/**,/api/v1/quotes/**

        - id: trip-service-route
          uri: lb://trip-service
          predicates:
            - Path=/api/v1/trips/**,/api/v1/offers/**

        - id: payment-service-route
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**,/api/v1/wallets/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
