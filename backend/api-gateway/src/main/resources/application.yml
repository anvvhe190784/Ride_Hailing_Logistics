server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    # noinspection HttpUrlsUsage
    import: "optional:configserver:http://localhost:8888"
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      default-filters:
        - name: SecureHeaders
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "https://app.ridehailing.com"
              - "https://driver.ridehailing.com"
              - "https://admin.ridehailing.com"
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: iam-service-route
          uri: lb://iam-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**

        - id: driver-service-route
          uri: lb://driver-service
          predicates:
            - Path=/api/v1/drivers/**,/api/v1/vehicles/**

        - id: location-service-route
          uri: lb://location-service
          predicates:
            - Path=/api/v1/locations/**

        - id: pricing-service-route
          uri: lb://pricing-service
          predicates:
            - Path=/api/v1/pricing/**,/api/v1/quotes/**

        - id: trip-service-route
          uri: lb://trip-service
          predicates:
            - Path=/api/v1/trips/**,/api/v1/offers/**

        - id: payment-service-route
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**,/api/v1/wallets/**

eureka:
  client:
    service-url:
      # noinspection HttpUrlsUsage
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,gateway

app:
  security:
    jwt:
      secret: ${JWT_SECRET}

