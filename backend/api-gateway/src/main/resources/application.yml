server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    # noinspection HttpUrlsUsage
    import: "optional:configserver:http://localhost:8888"
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s
        pool:
          type: ELASTIC
          max-idle-time: 15s
          max-life-time: 60s
      default-filters:
        - name: SecureHeaders
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "https://app.ridehailing.com"
              - "https://driver.ridehailing.com"
              - "https://admin.ridehailing.com"
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      routes:
        - id: iam-service-route
          uri: lb://iam-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**

        - id: driver-service-route
          uri: lb://driver-service
          predicates:
            - Path=/api/v1/drivers/**,/api/v1/vehicles/**

        - id: location-service-route
          uri: lb://location-service
          predicates:
            - Path=/api/v1/locations/**

        - id: pricing-service-route
          uri: lb://pricing-service
          predicates:
            - Path=/api/v1/pricing/quotes,/api/v1/pricing/quotes/{quoteId},/api/v1/pricing/quote,/api/v1/pricing/quote/{quoteId}

        - id: trip-service-route
          uri: lb://trip-service
          predicates:
            - Path=/api/v1/trips/**,/api/v1/offers/**

        - id: payment-service-route
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**,/api/v1/wallets/**

eureka:
  client:
    service-url:
      # noinspection HttpUrlsUsage
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{correlationId:-}] - %msg%n"

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,ping
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus

app:
  security:
    jwt:
      secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
  gateway:
    rate-limit:
      enabled: true
      replenish-rate: 50
      burst-capacity: 100

