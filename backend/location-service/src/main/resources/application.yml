server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: location-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    # noinspection HttpUrlsUsage
    import: "optional:configserver:http://localhost:8888"
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/location_db?currentSchema=location
    username: postgres
    password: ${DB_PASSWORD:admin} # pragma: allowlist-secret
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: location
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 2000ms

eureka:
  client:
    service-url:
      # noinspection HttpUrlsUsage
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{correlationId:-}] - %msg%n"

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,diskSpace,ping
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

---
spring:
  config:
    activate:
      on-profile: default
  jpa:
    hibernate:
      ddl-auto: none
