server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: iam-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    # noinspection HttpUrlsUsage
    import: "optional:configserver:http://localhost:8888"
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/iam_db?currentSchema=iam
    username: postgres
    password: ${DB_PASSWORD:admin} # pragma: allowlist-secret
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: iam
        format_sql: true

eureka:
  client:
    service-url:
      # noinspection HttpUrlsUsage
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt:
      secret: ${JWT_SECRET}

